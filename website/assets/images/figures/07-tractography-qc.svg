<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tractography quality-control workflow diagram</title>
  <desc id="desc">Diagram of left and right inferior VTA-NAc tractography results.</desc>
  <rect width="1600" height="900" fill="#eef2f3"/>
  <rect x="48" y="48" width="1504" height="804" rx="32" fill="#fbfaf7" stroke="#9aabba" stroke-width="4" stroke-dasharray="16 14"/>
  <text x="100" y="125" fill="#d9651a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5">WORKFLOW DIAGRAM 07</text>
  <text x="100" y="205" fill="#14233b" font-family="Helvetica, Arial, sans-serif" font-size="58">Inspect the reconstructed streamlines</text>
  <text x="100" y="256" fill="#586c84" font-family="Arial, sans-serif" font-size="25">Recommended: paired left/right native-space streamline views with seed and target ROIs</text>
  <g transform="translate(120 345)" font-family="Arial, sans-serif">
    <g fill="#fff" stroke="#dce3e9" stroke-width="3"><rect width="630" height="360" rx="24"/><rect x="730" width="630" height="360" rx="24"/></g>
    <g fill="#14233b" font-size="25" font-weight="700"><text x="30" y="48">Left Inferior VTA–NAc</text><text x="760" y="48">Right Inferior VTA–NAc</text></g>
    <g transform="translate(105 80)" fill="none" stroke-linecap="round"><ellipse cx="205" cy="122" rx="190" ry="112" fill="#edf1f4" stroke="#bdc8d4" stroke-width="4"/><g stroke="#d9651a" stroke-width="6" opacity=".75"><path d="M90 160c54-105 136-106 225-38"/><path d="M83 169c67-95 149-97 246-40"/><path d="M100 148c55-91 126-97 219-29"/><path d="M92 177c71-85 153-90 237-51"/></g><circle cx="88" cy="167" r="23" fill="#147d75"/><circle cx="322" cy="126" r="23" fill="#9f4557"/></g>
    <g transform="translate(835 80)" fill="none" stroke-linecap="round"><ellipse cx="205" cy="122" rx="190" ry="112" fill="#edf1f4" stroke="#bdc8d4" stroke-width="4"/><g stroke="#d9651a" stroke-width="6" opacity=".75"><path d="M90 160c54-105 136-106 225-38"/><path d="M83 169c67-95 149-97 246-40"/><path d="M100 148c55-91 126-97 219-29"/><path d="M92 177c71-85 153-90 237-51"/></g><circle cx="88" cy="167" r="23" fill="#147d75"/><circle cx="322" cy="126" r="23" fill="#9f4557"/></g>
    <g fill="#586c84" font-size="19"><text x="30" y="330">Confirm ipsilateral course and target entry.</text><text x="760" y="330">Save one QC image per participant.</text></g>
  </g>
  <text x="100" y="805" fill="#75879a" font-family="Arial, sans-serif" font-size="20">Replacement filename: 07-tractography-qc.svg</text>
</svg>
