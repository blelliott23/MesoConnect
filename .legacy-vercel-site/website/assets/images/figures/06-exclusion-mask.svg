<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Exclusion mask workflow diagram</title>
  <desc id="desc">Diagram showing corridor inversion and brain-mask intersection.</desc>
  <rect width="1600" height="900" fill="#eef2f3"/>
  <rect x="48" y="48" width="1504" height="804" rx="32" fill="#fbfaf7" stroke="#9aabba" stroke-width="4" stroke-dasharray="16 14"/>
  <text x="100" y="125" fill="#d9651a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5">WORKFLOW DIAGRAM 06</text>
  <text x="100" y="205" fill="#14233b" font-family="Helvetica, Arial, sans-serif" font-size="58">Create the outside-corridor exclusion mask</text>
  <text x="100" y="256" fill="#586c84" font-family="Arial, sans-serif" font-size="25">Recommended: show the inclusion corridor, inverse, and final masked exclusion volume</text>
  <g transform="translate(110 360)" font-family="Arial, sans-serif">
    <g fill="#fff" stroke="#dce3e9" stroke-width="3"><rect width="390" height="320" rx="24"/><rect x="495" width="390" height="320" rx="24"/><rect x="990" width="390" height="320" rx="24"/></g>
    <g fill="#14233b" font-size="24" font-weight="700"><text x="26" y="45">Native corridor</text><text x="521" y="45">Binary inverse</text><text x="1016" y="45">Brain-masked exclusion</text></g>
    <g transform="translate(66 82)"><ellipse cx="130" cy="105" rx="120" ry="91" fill="#dce3e9"/><path d="M75 132c34-72 78-78 112-29" fill="none" stroke="#d9651a" stroke-width="25"/></g>
    <text x="438" y="195" fill="#586c84" font-size="48">→</text>
    <g transform="translate(561 82)"><ellipse cx="130" cy="105" rx="120" ry="91" fill="#9f4557" opacity=".72"/><path d="M75 132c34-72 78-78 112-29" fill="none" stroke="#fff" stroke-width="27"/></g>
    <text x="933" y="195" fill="#586c84" font-size="48">→</text>
    <g transform="translate(1056 82)"><ellipse cx="130" cy="105" rx="120" ry="91" fill="#9f4557" opacity=".72"/><path d="M75 132c34-72 78-78 112-29" fill="none" stroke="#fff" stroke-width="27"/><ellipse cx="130" cy="105" rx="120" ry="91" fill="none" stroke="#152b4f" stroke-width="5"/></g>
    <g fill="#586c84" font-size="19"><text x="26" y="292">Allowed anatomical route</text><text x="521" y="292">Everything outside route</text><text x="1016" y="292">Limited to brain voxels</text></g>
  </g>
  <text x="100" y="805" fill="#75879a" font-family="Arial, sans-serif" font-size="20">Replacement filename: 06-exclusion-mask.svg</text>
</svg>
