<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Registration direction for transforming an MNI atlas to participant space</title>
  <desc id="desc">Two-stage diagram. First, register a participant native T1 image to an MNI template to estimate the native-to-MNI transform. Second, apply the inverse transform to an MNI atlas mask, using the participant diffusion or T1 image as the fixed reference grid, to create a native-space atlas mask.</desc>

  <!-- Palette and typography match the MesoConnect website. -->
  <defs>
    <marker id="arrow-navy" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#152b4f"/>
    </marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#147d75"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1500" height="820" rx="34" fill="#fbfaf7"/>
  <text x="70" y="70" fill="#0b172a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="700">Register anatomy first, then move the atlas back</text>
  <text x="70" y="110" fill="#586c84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22">“Moving” is transformed; “fixed/reference” defines the target anatomy and output grid.</text>

  <!-- Row 1: estimate the forward transform. -->
  <rect x="55" y="145" width="1390" height="250" rx="24" fill="#ffffff" stroke="#dce3e9" filter="url(#shadow)"/>
  <rect x="80" y="168" width="150" height="34" rx="17" fill="#fff0df"/>
  <text x="155" y="192" text-anchor="middle" fill="#b75113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">1 · ESTIMATE</text>

  <rect x="95" y="220" width="355" height="135" rx="18" fill="#edf1f4" stroke="#bdc8d4"/>
  <ellipse cx="160" cy="287" rx="41" ry="49" fill="#c8d0d8" stroke="#75879a" stroke-width="3"/>
  <path d="M136 271 C149 250 175 252 185 267 C202 272 203 297 188 305 C184 327 150 333 138 314 C119 309 117 281 136 271Z" fill="#f8fafb" stroke="#75879a" stroke-width="3"/>
  <text x="220" y="267" fill="#14233b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700">Participant T1</text>
  <text x="220" y="299" fill="#3b506d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20">native anatomy</text>
  <text x="220" y="329" fill="#d9651a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">MOVING IMAGE</text>

  <line x1="480" y1="287" x2="650" y2="287" stroke="#152b4f" stroke-width="7" marker-end="url(#arrow-navy)"/>
  <text x="560" y="256" text-anchor="middle" fill="#152b4f" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700">register</text>

  <rect x="680" y="220" width="355" height="135" rx="18" fill="#e8eef7" stroke="#8ba0bd"/>
  <ellipse cx="745" cy="287" rx="41" ry="49" fill="#9fb0c7" stroke="#152b4f" stroke-width="3"/>
  <path d="M721 271 C734 250 760 252 770 267 C787 272 788 297 773 305 C769 327 735 333 723 314 C704 309 702 281 721 271Z" fill="#ffffff" stroke="#152b4f" stroke-width="3"/>
  <text x="805" y="267" fill="#14233b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700">MNI152 template</text>
  <text x="805" y="299" fill="#3b506d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20">standard-space target</text>
  <text x="805" y="329" fill="#147d75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">FIXED / REFERENCE</text>

  <rect x="1080" y="230" width="320" height="115" rx="18" fill="#152b4f"/>
  <text x="1240" y="268" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Estimated transform</text>
  <text x="1240" y="307" text-anchor="middle" fill="#ffc570" font-family="SFMono-Regular, Consolas, monospace" font-size="24">T native → MNI</text>
  <text x="1240" y="332" text-anchor="middle" fill="#d5deea" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16">save this transform</text>

  <!-- Row 2: use the inverse transform for the atlas. -->
  <rect x="55" y="425" width="1390" height="265" rx="24" fill="#ffffff" stroke="#dce3e9" filter="url(#shadow)"/>
  <rect x="80" y="448" width="230" height="34" rx="17" fill="#dff4f0"/>
  <text x="195" y="472" text-anchor="middle" fill="#11665f" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">2 · APPLY INVERSE</text>

  <rect x="85" y="505" width="300" height="135" rx="18" fill="#fff0df" stroke="#e3a675"/>
  <ellipse cx="143" cy="573" rx="38" ry="45" fill="#f2d3ae" stroke="#b75113" stroke-width="3"/>
  <path d="M134 546 C154 555 167 572 160 596 C146 605 127 596 124 580 C115 566 120 552 134 546Z" fill="#f59e0b" stroke="#b75113" stroke-width="3"/>
  <text x="198" y="552" fill="#14233b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="700">MNI atlas mask</text>
  <text x="198" y="584" fill="#3b506d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19">standard-space label</text>
  <text x="198" y="615" fill="#d9651a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">MOVING IMAGE</text>

  <line x1="410" y1="573" x2="605" y2="573" stroke="#147d75" stroke-width="7" marker-end="url(#arrow-teal)"/>
  <text x="507" y="528" text-anchor="middle" fill="#11665f" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">apply inverse transform</text>
  <text x="507" y="554" text-anchor="middle" fill="#3b506d" font-family="SFMono-Regular, Consolas, monospace" font-size="17">T MNI → native</text>

  <rect x="635" y="505" width="355" height="135" rx="18" fill="#e8eef7" stroke="#8ba0bd"/>
  <ellipse cx="700" cy="573" rx="41" ry="49" fill="#c8d0d8" stroke="#152b4f" stroke-width="3"/>
  <path d="M676 557 C689 536 715 538 725 553 C742 558 743 583 728 591 C724 613 690 619 678 600 C659 595 657 567 676 557Z" fill="#ffffff" stroke="#152b4f" stroke-width="3"/>
  <text x="760" y="548" fill="#14233b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="700">Participant grid</text>
  <text x="760" y="580" fill="#3b506d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19">diffusion or T1 reference</text>
  <text x="760" y="612" fill="#147d75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">FIXED / REFERENCE</text>

  <line x1="1015" y1="573" x2="1105" y2="573" stroke="#152b4f" stroke-width="7" marker-end="url(#arrow-navy)"/>

  <rect x="1135" y="505" width="265" height="135" rx="18" fill="#e4f1eb" stroke="#78a891"/>
  <ellipse cx="1190" cy="573" rx="36" ry="43" fill="#c8d0d8" stroke="#2b7056" stroke-width="3"/>
  <path d="M1182 548 C1201 558 1211 573 1205 595 C1191 604 1174 596 1172 581 C1164 567 1168 553 1182 548Z" fill="#f59e0b" stroke="#b75113" stroke-width="3"/>
  <text x="1240" y="550" fill="#14233b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Native atlas</text>
  <text x="1240" y="582" fill="#3b506d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18">mask on the exact</text>
  <text x="1240" y="609" fill="#3b506d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18">participant grid</text>

  <!-- Template-to-template conversion follows the same rule. -->
  <rect x="55" y="720" width="1390" height="64" rx="18" fill="#edf1f4"/>
  <text x="85" y="760" fill="#14233b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Different MNI variants?</text>
  <text x="315" y="760" fill="#3b506d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20">Source template or atlas = moving · desired MNI template/grid = fixed/reference · always inspect the transformed result.</text>
</svg>
